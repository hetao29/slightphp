; 单参数：/r-ini/hello -> /lab/route/entry/hello
[route_ini]
pattern = "^\/r-ini\/:slug$"
:slug = "[A-Za-z0-9_]{1,40}"
zone = "lab"
page = "route"
entry = "entry"

; 多参数：/r-pair/2026/11 -> /lab/route/entry/2026/11
[route_pair]
pattern = "^\/r-pair\/:year\/:month$"
:year = "\d{4}"
:month = "(?:0[1-9]|1[0-2])"
zone = "lab"
page = "route"
entry = "entry"

; 固定短地址
[tasks]
pattern = "^\/tasks$"
zone = "workspace"
page = "main"
entry = "entry"

[tasks_api]
pattern = "^\/tasks\.json$"
zone = "workspace"
page = "main"
entry = "api"

[tasks_save]
pattern = "^\/tasks\/save$"
zone = "workspace"
page = "main"
entry = "save"
